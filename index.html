<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPO Radar">
<meta name="theme-color" content="#0C1622">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>IPO Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#05080d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text)}
[data-skin]{--bg:#0C1622;--panel:#16263A;--ink:#F1E6CE;--label:#C9B48A;--sub:#93A0AE;--accent:#C9A85C;--on-accent:#0C1622;--accent-text:#DCC07A;--soft:rgba(201,168,92,.15);--well:rgba(0,0,0,.3);--tint:rgba(201,168,92,.18)}
[data-skin="cherry"]{--bg:#1C0B12;--panel:#42121F;--ink:#EFE1CE;--label:#D2A79F;--sub:#C2938A;--accent:#B9857C;--on-accent:#1C0B12;--accent-text:#D9A79E;--soft:rgba(239,225,206,.12);--well:rgba(0,0,0,.28);--tint:rgba(185,133,124,.18)}
[data-skin="copper"]{--bg:#000000;--panel:#1A0F0A;--ink:#F1DCCB;--label:#C9916A;--sub:#A9745A;--accent:#C4855C;--on-accent:#000000;--accent-text:#D69A72;--soft:rgba(196,133,92,.16);--well:rgba(255,255,255,.05);--tint:rgba(196,133,92,.18)}
[data-skin="ember"]{--bg:#100B08;--panel:#2A1A0E;--ink:#F7E7CF;--label:#DDAA85;--sub:#BD8558;--accent:#E07A1F;--on-accent:#1A0F06;--accent-text:#F0933A;--soft:rgba(224,122,31,.16);--well:rgba(0,0,0,.32);--tint:rgba(224,122,31,.18)}
[data-skin="gold"]{--bg:#0D0D0D;--panel:#1C1C1E;--ink:#EFE6D8;--label:#C9B79A;--sub:#A39F98;--accent:#B08D57;--on-accent:#0D0D0D;--accent-text:#C4A06A;--soft:rgba(176,141,87,.16);--well:rgba(58,47,42,.6);--tint:rgba(176,141,87,.18)}
[data-skin="sand"]{--bg:#D9C4A1;--panel:#E8D9BE;--ink:#10141F;--label:#3A3222;--sub:#4A4030;--accent:#10141F;--on-accent:#E6CFA0;--accent-text:#10141F;--soft:rgba(16,20,31,.1);--well:rgba(16,20,31,.07);--tint:rgba(16,20,31,.12)}
[data-skin="glass"]{--bg:#18212E;--panel:rgba(255,255,255,.1);--ink:#FFFFFF;--label:rgba(255,255,255,.82);--sub:rgba(255,255,255,.62);--accent:#FFFFFF;--on-accent:#18212E;--accent-text:#FFFFFF;--soft:rgba(255,255,255,.14);--well:rgba(255,255,255,.08);--tint:rgba(255,255,255,.16)}
[data-skin]{--sheen:rgba(255,255,255,.1);--line:rgba(255,255,255,.035);--edge:rgba(255,255,255,.16);
--grain:repeating-linear-gradient(115deg,var(--line) 0 1px,transparent 1px 3px);
--weave:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 4px);
--panel-fill:linear-gradient(135deg,var(--sheen),transparent 40%),var(--grain),var(--panel);
--accent-fill:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 46%,rgba(0,0,0,.18)),var(--accent);
--bg-fill:radial-gradient(120% 55% at 50% 0%,var(--tint),transparent 70%),var(--weave),var(--bg)}
[data-skin="sand"]{--sheen:rgba(255,255,255,.5);--line:rgba(16,20,31,.04);--edge:rgba(255,255,255,.7)}
[data-skin="ember"]{--accent-fill:linear-gradient(180deg,#F2A24A 0%,#E07A1F 36%,#C8661E 62%,#E58A2E 100%)}
[data-skin="glass"]{--edge:rgba(255,255,255,.34);--panel-fill:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 45%),var(--panel);
--bg-fill:radial-gradient(70% 40% at 15% 8%,rgba(120,170,255,.55),transparent 70%),radial-gradient(60% 40% at 90% 30%,rgba(255,140,190,.4),transparent 70%),radial-gradient(80% 50% at 40% 100%,rgba(110,230,200,.35),transparent 70%),var(--bg)}
[data-skin="glass"] section{-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
#app{max-width:480px;height:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-fill);color:var(--label);font-family:'Space Grotesk',system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 20px 12px}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
section{flex:none;border-radius:20px;padding:18px;background:var(--panel-fill);display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--line),0 10px 24px rgba(0,0,0,.28)}
h2{margin:0;flex:1;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--label)}
.hd{display:flex;align-items:center;gap:8px}
.cap{font-size:11px;letter-spacing:.1em;color:var(--sub)}
.pill{height:44px;padding:0 16px;border-radius:22px;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);background:var(--soft);white-space:nowrap}
.pill.on,.cta{color:var(--on-accent);background:var(--accent-fill)}
.cta{height:48px;border-radius:24px;font-size:12px;font-weight:500;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:6px;min-height:60px;padding:4px 6px 4px 16px;border-radius:14px;background:var(--well)}
.row>.open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 0;background:none;text-align:left;color:inherit}
.t{font-size:13px;line-height:1.45;color:var(--ink)}
.m{font-size:11px;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.num{flex:none;font-size:15px;font-weight:500;color:var(--accent-text);font-variant-numeric:tabular-nums}
.star{flex:none;width:44px;height:44px;border-radius:22px;background:var(--soft);color:var(--sub);font-size:17px;line-height:1}
.star.on{color:var(--on-accent);background:var(--accent-fill)}
.well{border-radius:14px;background:var(--well);padding:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--well)}
.stat b{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.stat small{font-size:10.5px;letter-spacing:.08em;color:var(--label)}
.badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:500;letter-spacing:.08em;background:var(--tint);color:var(--accent-text)}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--soft)}
.dot.new{background:var(--accent-text)}
.note{font-size:12px;line-height:1.5;color:var(--ink)}
textarea{width:100%;min-height:76px;border-radius:14px;padding:12px 16px;background:var(--well);color:var(--ink);font-size:13px;line-height:1.45;resize:vertical;cursor:text}
textarea::placeholder{color:var(--sub)}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px 12px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--soft)}
nav button{position:relative;height:52px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;letter-spacing:.06em;border-radius:16px;background:transparent;color:var(--label)}
nav button.on{background:var(--tint);color:var(--accent-text)}
nav svg,header svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav i{position:absolute;top:7px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-radius:16px;background:var(--well);color:var(--label);font-size:10.5px;letter-spacing:.04em}
.sk.on{background:var(--tint);color:var(--accent-text)}
.sk span{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft)}
.sk.on span{border-color:var(--accent)}

input.in,select.in{height:44px;border-radius:22px;padding:0 16px;background:var(--well);color:var(--ink);font-size:13px;font-weight:500;min-width:0;width:100%;cursor:text;-webkit-appearance:none;appearance:none}
select.in{cursor:pointer;font-size:11px;letter-spacing:.08em}
select.in option{color:#111;background:#fff}
input.in::placeholder{color:var(--sub)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal span{height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;color:var(--ink);background:var(--well)}
.cal span.wd{height:22px;background:none;font-size:10px;letter-spacing:.08em;color:var(--sub)}
.cal span.off{background:none}
.cal span.td{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal span i{width:5px;height:5px;border-radius:50%;background:var(--accent-text)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 2px;font-size:12px;line-height:1.45}
.kv>span:first-child{flex:none;letter-spacing:.08em;color:var(--label);font-size:11px}
.kv>span:last-child{color:var(--ink);text-align:right;overflow-wrap:anywhere}
.cmp{display:grid;gap:6px;align-items:stretch}
.cmp div{padding:10px;border-radius:12px;background:var(--well);font-size:12px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.cmp div.l{background:none;padding:10px 2px;font-size:10px;letter-spacing:.08em;color:var(--label)}
.cmp div.h{font-weight:500;color:var(--accent-text)}
.x{flex:none;width:44px;height:44px;border-radius:22px;background:var(--soft);color:var(--accent-text);font-size:15px;font-weight:500}
</style>
</head>
<body>
<div id="app" data-skin="navy"></div>
<script>
(function(){
var app=document.getElementById('app');
var S={tab:'radar',detail:null,skin:'navy',lang:'en',fav:{},trk:{},alerts:{},paper:[],cmp:[],newsSeen:'',newsF:'all',pipeV:'list',listV:'prices',q:'',region:'all',sector:'',stageF:'',calM:0};
var PK=['skin','lang','fav','trk','alerts','paper','cmp','newsSeen'];
var IPOS=[],NEWS=[],META=null,ready=false,slow=false,db=null,uid=null,userDoc=null,refocus=false;
var KEY='ipo-radar-state';
try{var ls=JSON.parse(localStorage.getItem(KEY)||'null');if(ls)PK.forEach(function(k){if(ls[k]!=null)S[k]=ls[k];});}catch(e){}

function L(en,nl){return S.lang==='nl'?nl:en;}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function url(u){return /^https?:\/\//i.test(String(u||''))?esc(u):'';}
function prefs(){var o={};PK.forEach(function(k){o[k]=S[k];});return o;}
var wT=null,wChain=Promise.resolve();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(prefs()));}catch(e){}
  if(!userDoc)return;
  clearTimeout(wT);
  wT=setTimeout(function(){var body=JSON.parse(JSON.stringify(prefs()));wChain=wChain.then(function(){return userDoc.set(body);}).catch(function(){});},700);
}
var STAGE={pricing:60,filed:46,confidential:34,prep:24,watch:14,paused:8};
function score(i){if(i.stage==='listed')return 0;var v=Number(i.valB)||1,size=Math.max(0,Math.min(40,Math.log(v)/Math.LN10/3*40));return Math.round((STAGE[i.stage]||10)+size);}
function stageLbl(s){return{pricing:L('PRICING NOW','PRIJS WORDT BEPAALD'),filed:L('FILED','INGEDIEND'),confidential:L('CONFIDENTIAL FILING','VERTROUWELIJK INGEDIEND'),prep:L('PREPARING','IN VOORBEREIDING'),watch:L('ON WATCH','OP DE RADAR'),paused:L('PAUSED','UITGESTELD'),listed:L('LISTED','GENOTEERD')}[s]||String(s||'').toUpperCase();}
function num(v){var n=Number(v);return isFinite(n)&&v!==''&&v!=null?n:null;}
function pct(i){var a=num(i.ipoNum),b=num(i.lastNum);return a&&b!=null?(b/a-1)*100:(num(i.chg)==null?null:num(i.chg));}
function d1(i){var a=num(i.ipoNum),b=num(i.day1Num);return a&&b!=null?(b/a-1)*100:num(i.day1Chg);}
function fp(p){return p==null?'—':(p<0?'▼ ':'▲ ')+Math.abs(p).toFixed(1)+'%';}
function pcol(p){return p!=null&&p<0?'var(--accent-text)':'var(--sub)';}
function money(i,n){return n==null?'—':esc(i.cur||'')+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});}
function match(i){
  if(S.region!=='all'&&(i.region||'other')!==S.region)return false;
  if(S.sector&&i.sector!==S.sector)return false;
  var q=S.q.trim().toLowerCase();
  if(q&&[i.name,i.ticker,i.sector,i.country,i.exchange].join(' ').toLowerCase().indexOf(q)<0)return false;
  return true;
}
function upcoming(){return IPOS.filter(function(i){return i.stage!=='listed';}).sort(function(a,b){return score(b)-score(a);});}
function listed(){return IPOS.filter(function(i){return i.stage==='listed';}).sort(function(a,b){return String(b.date||'')<String(a.date||'')?-1:1;});}
function byId(id){for(var k=0;k<IPOS.length;k++)if(IPOS[k].id===id)return IPOS[k];return null;}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function today(){return iso(new Date());}
function isD(v){return /^\d{4}-\d{2}-\d{2}$/.test(String(v||''));}
function daysTo(d){return Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);}
function loc(){return S.lang==='nl'?'nl-NL':'en-GB';}
function fmtDate(v){if(!isD(String(v||'').slice(0,10)))return esc(v||'');return new Date(String(v).slice(0,10)+'T00:00:00').toLocaleDateString(loc(),{day:'numeric',month:'short'}).toUpperCase().replace(/\./g,'');}
function snap(i){return{stage:i.stage||'',when:i.when||'',range:i.range||''};}
function changes(i){var t=S.trk[i.id];if(!t||!t.snap)return[];var n=snap(i),o=t.snap,out=[];
  if(o.stage!==n.stage)out.push('Status: '+stageLbl(o.stage)+' → '+stageLbl(n.stage));
  if(o.when!==n.when)out.push('Timing: '+(o.when||'—')+' → '+(n.when||'—'));
  if(o.range!==n.range)out.push(L('Price range: ','Prijsrange: ')+(o.range||'—')+' → '+(n.range||'—'));
  return out;}
function mine(id){return !!(S.fav[id]||S.trk[id]);}
function newNews(){return NEWS.filter(function(n){return String(n.date||'')>S.newsSeen;}).length;}
function hit(id){var a=S.alerts[id],i=byId(id),l=i&&num(i.lastNum);if(!a||l==null)return false;return a.dir==='above'?l>=a.level:l<=a.level;}
function events(){var out=[];IPOS.forEach(function(i){
  if(isD(i.priceDate))out.push({d:i.priceDate,i:i,t:L('Pricing','Prijsbepaling')});
  if(isD(i.date))out.push({d:i.date,i:i,t:L('First trading day','Eerste handelsdag')});
  if(isD(i.lockupDate))out.push({d:i.lockupDate,i:i,t:L('Lock-up expiry','Einde lock-up')});
});return out.sort(function(a,b){return a.d<b.d?-1:1;});}

function row(i,rank){
  var isL=i.stage==='listed',p=pct(i);
  var right=isL?'<span class="num" style="color:'+pcol(p)+'">'+fp(p)+'</span>':'<span class="num">'+score(i)+'</span>';
  var tags=(changes(i).length?' <span class="badge">'+L('UPDATED','GEWIJZIGD')+'</span>':'')+(hit(i.id)?' <span class="badge">'+L('ALERT','ALERT')+'</span>':'');
  var meta=isL?(esc(i.ticker||i.exchange||'')+' · '+esc(i.ipoPrice||'')+' → '+esc(i.last||'')):(stageLbl(i.stage)+' · '+esc(i.when||''));
  return '<div class="row"><button class="open" data-act="open" data-id="'+esc(i.id)+'">'+(rank?'<span class="num" style="width:22px;color:var(--sub)">'+rank+'</span>':'')+'<span class="col"><span class="t">'+esc(i.name)+tags+'</span><span class="m">'+meta+'</span></span>'+right+'</button><button class="star'+(S.fav[i.id]?' on':'')+'" data-act="fav" data-id="'+esc(i.id)+'" aria-pressed="'+!!S.fav[i.id]+'" aria-label="'+L('Favorite: ','Favoriet: ')+esc(i.name)+'">'+(S.fav[i.id]?'★':'☆')+'</button></div>';
}
function newsRow(n){
  var u=url(n.url),isNew=String(n.date||'')>S.newsSeen,i=n.ipo&&byId(n.ipo);
  var inner='<span class="dot'+(isNew?' new':'')+'" aria-hidden="true"></span><span class="col"><span class="t">'+esc(n.title)+'</span>'+(n.summary?'<span class="note" style="color:var(--label)">'+esc(n.summary)+'</span>':'')+'<span class="m">'+fmtDate(n.date)+' · '+esc(n.source||'')+(i?' · '+esc(i.name):'')+'</span></span>';
  return u?'<a class="well" href="'+u+'" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;text-decoration:none">'+inner+'<span class="num" aria-hidden="true">↗</span></a>':'<div class="well" style="display:flex;align-items:center;gap:12px">'+inner+'</div>';
}
function empty(msg){return '<div class="well note">'+msg+'</div>';}
function loadingMsg(){return slow?L('The data can’t be reached yet. It will appear here as soon as it loads.','De gegevens zijn nog niet bereikbaar. Ze verschijnen hier zodra ze geladen zijn.'):L('Loading…','Laden…');}
function seg(act,cur,opts){return '<div class="grid'+opts.length+'" style="flex:none">'+opts.map(function(o){var on=cur===o[0];return '<button class="pill'+(on?' on':'')+'" data-act="'+act+'" data-id="'+o[0]+'" aria-pressed="'+on+'" style="padding:0 6px">'+o[1]+'</button>';}).join('')+'</div>';}
function filters(withStage){
  var sectors={};IPOS.forEach(function(i){if(i.sector&&((i.stage==='listed')!==withStage))sectors[i.sector]=1;});
  var h='<section><input id="q" class="in" type="search" autocomplete="off" value="'+esc(S.q)+'" placeholder="'+L('Search name, ticker, sector…','Zoek naam, ticker, sector…')+'" aria-label="'+L('Search','Zoeken')+'">'+seg('region',S.region,[['all',L('ALL','ALLES')],['eu',L('EUROPE','EUROPA')],['us','US'],['other',L('OTHER','OVERIG')]]);
  h+='<div class="grid2"><select id="sector" class="in" aria-label="Sector"><option value="">'+L('ALL SECTORS','ALLE SECTOREN')+'</option>'+Object.keys(sectors).sort().map(function(s){return '<option value="'+esc(s)+'"'+(S.sector===s?' selected':'')+'>'+esc(s.toUpperCase())+'</option>';}).join('')+'</select>';
  h+=withStage?'<select id="stageF" class="in" aria-label="Status"><option value="">'+L('ALL STAGES','ALLE STADIA')+'</option>'+['pricing','filed','confidential','prep','watch','paused'].map(function(s){return '<option value="'+s+'"'+(S.stageF===s?' selected':'')+'>'+stageLbl(s)+'</option>';}).join('')+'</select>':'<button class="pill" data-act="clearf">'+L('CLEAR FILTERS','WIS FILTERS')+'</button>';
  return h+'</div></section>';
}

function vRadar(){
  var up=upcoming(),h='';
  if(!ready)return '<section>'+empty(loadingMsg())+'</section>';
  if(!IPOS.length)return '<section>'+empty(L('No IPO data yet. It is filled in by the daily update.','Nog geen IPO-gegevens. Die worden gevuld door de dagelijkse update.'))+'</section>';
  var next=IPOS.filter(function(i){return i.stage!=='listed'&&isD(i.date)&&daysTo(i.date)>=0;}).sort(function(a,b){return a.date<b.date?-1:1;})[0];
  if(next){var d=daysTo(next.date);
    h+='<section style="flex-direction:row;align-items:center;gap:12px"><div class="col" style="gap:4px"><h2>'+L('NEXT LISTING','VOLGENDE NOTERING')+'</h2><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:40px;font-weight:500;line-height:1;color:var(--accent)">'+(d===0?L('TODAY','VANDAAG'):d)+'</span>'+(d===0?'':'<span class="cap">'+(d===1?L('DAY','DAG'):L('DAYS','DAGEN'))+'</span>')+'</div><span class="t">'+esc(next.name)+' · '+esc(next.ticker||'')+'</span><span class="m">'+fmtDate(next.date)+' · '+esc(next.exchange||'')+(next.range?' · '+esc(next.range):'')+'</span></div><button class="pill on" data-act="open" data-id="'+esc(next.id)+'">OPEN</button></section>';}

  if(isL&&num(i.lastNum)!=null){var a=S.alerts[i.id];
    h+='<section><div class="hd"><h2>'+L('PRICE ALERT','KOERSALERT')+'</h2><span class="cap">'+(a?(a.dir==='above'?L('ABOVE ','BOVEN '):L('BELOW ','ONDER '))+money(i,a.level)+(hit(i.id)?' · '+L('REACHED','BEREIKT'):''):L('NOT SET','NIET INGESTELD'))+'</span></div><input id="lvl" class="in" inputmode="decimal" placeholder="'+L('Price level, e.g. ','Koersniveau, bv. ')+esc(String(i.lastNum))+'" aria-label="'+L('Price level','Koersniveau')+'" value="'+(a?esc(String(a.level)):'')+'"><div class="grid2"><button class="pill" data-act="al" data-id="above">'+L('ALERT ABOVE','ALERT BOVEN')+'</button><button class="pill" data-act="al" data-id="below">'+L('ALERT BELOW','ALERT ONDER')+'</button></div><div class="note" style="color:var(--sub)">'+L('Checked against the latest daily price ('+esc(i.asOf||'date unknown')+'), shown in My List — not a live push alert.','Vergeleken met de laatste dagkoers ('+esc(i.asOf||'datum onbekend')+'), zichtbaar in Mijn lijst — geen live pushmelding.')+'</div></section>';
    if(num(i.ipoNum))h+='<section><h2>'+L('PAPER BUY','OEFENAANKOOP')+'</h2><input id="amt" class="in" inputmode="decimal" value="1000" aria-label="'+L('Amount','Bedrag')+'"><div class="grid2"><button class="pill" data-act="buy" data-id="ipo">'+L('AT IPO PRICE','OP IPO-PRIJS')+' '+money(i,i.ipoNum)+'</button>'+(num(i.day1Num)?'<button class="pill" data-act="buy" data-id="day1">'+L('AT DAY-1 CLOSE','OP SLOT DAG 1')+' '+money(i,i.day1Num)+'</button>':'<span></span>')+'</div><div class="note" style="color:var(--sub)">'+L('Pretend money, in '+esc(i.cur||'local currency')+'. See the result under My List.','Nepgeld, in '+esc(i.cur||'lokale valuta')+'. Bekijk het resultaat onder Mijn lijst.')+'</div></section>';}
  var f=Array.isArray(i.facts)?i.facts:[];
  if(f.length)h+='<section><h2>'+L('KEY FACTS','KERNFEITEN')+'</h2>'+f.map(function(x){return '<div class="well note">'+esc(x)+'</div>';}).join('')+'</section>';
  var s=i.sheet||{},fin=i.fin||{},rev=Array.isArray(s.revenue)?s.revenue:[],risks=Array.isArray(s.risks)?s.risks:[];
  var body=(fin.rev||fin.growth||fin.net?'<div class="grid3">'+stat(fin.rev,L('REVENUE','OMZET'))+stat(fin.growth,L('GROWTH','GROEI'))+stat(fin.net,L('NET RESULT','NETTORESULTAAT'))+'</div>':'')+rev.map(function(r){return kv(esc(r.p||''),r.v);}).join('')+kv(L('UNDERWRITERS','BEGELEIDERS'),s.underwriters)+kv(L('BIGGEST HOLDERS','GROOTSTE HOUDERS'),s.holders)+kv(L('USE OF PROCEEDS','BESTEDING'),s.proceeds)+kv(L('LOCK-UP','LOCK-UP'),s.lockup)+kv(L('OFFER','AANBOD'),s.offer)+(risks.length?'<div class="cap" style="margin-top:6px">'+L('MAIN RISKS','BELANGRIJKSTE RISICO’S')+'</div>'+risks.map(function(x){return '<div class="well note">'+esc(x)+'</div>';}).join(''):'');
  h+='<section><h2>'+L('FACT SHEET','FACTSHEET')+'</h2>'+(body||empty(L('No prospectus details on file yet. They are added once a filing is public.','Nog geen prospectusgegevens bekend. Die worden toegevoegd zodra er een openbare indiening is.')))+'</section>';
  h+='<section><h2>'+L('CAN I BUY IT?','KAN IK HET KOPEN?')+'</h2><div class="well note">'+esc(access(i))+'</div></section>';
  var rn=NEWS.filter(function(n){return n.ipo===i.id;});
  if(rn.length)h+='<section><h2>'+L('NEWS','NIEUWS')+'</h2>'+rn.map(newsRow).join('')+'</section>';
  var src=(Array.isArray(i.sources)?i.sources:[]).filter(function(x){return x&&url(x.u);});
  if(src.length)h+='<section><div class="hd"><h2>'+L('SOURCES','BRONNEN')+'</h2><span class="cap">'+(i.updated?L('CHECKED ','GECONTROLEERD ')+fmtDate(i.updated):'')+'</span></div>'+src.map(function(x){return '<a class="well note" href="'+url(x.u)+'" target="_blank" rel="noopener" style="display:flex;gap:12px;text-decoration:none"><span class="col">'+esc(x.t||x.u)+'</span><span class="num" aria-hidden="true">↗</span></a>';}).join('')+'</section>';
  return h;
}
function vSet(){
  var SK=[['navy','MIDNIGHT','#16263A'],['cherry','CHERRY','#721D35'],['copper','COPPER','#C4855C'],['ember','TIGER EYE','#E07A1F'],['gold',L('GOLD','GOUD'),'#B08D57'],['sand','CHAMPAGNE','#D9C4A1'],['glass',L('GLASS','GLAS'),'linear-gradient(135deg,#8FB4FF,#FF9CC4 55%,#7FE6CC)']];
  return '<section style="gap:14px"><h2>'+L('SKIN','THEMA')+'</h2><div class="grid3">'+SK.map(function(k){var on=S.skin===k[0];return '<button class="sk'+(on?' on':'')+'" data-act="skin" data-id="'+k[0]+'" aria-pressed="'+on+'"><span aria-hidden="true" style="background:'+k[2]+'"></span>'+k[1]+'</button>';}).join('')+'</div></section><section style="gap:14px"><h2>'+L('LANGUAGE','TAAL')+'</h2>'+seg('lang',S.lang,[['nl','NEDERLANDS'],['en','ENGLISH']])+'</section><section><h2>'+L('ABOUT THE DATA','OVER DE GEGEVENS')+'</h2><div class="note">'+L('IPO details, prices and news are refreshed by a daily update and come from public reporting; each company lists its sources. Dates, price ranges and valuations for upcoming listings are plans or press reports and can change. Prices are not live. Nothing here is investment advice.','IPO-gegevens, koersen en nieuws worden dagelijks bijgewerkt en komen uit openbare berichtgeving; elk bedrijf toont zijn bronnen. Data, prijsranges en waarderingen van komende beursgangen zijn plannen of persberichten en kunnen wijzigen. Koersen zijn niet live. Niets hier is beleggingsadvies.')+'</div>'+(uid?'':'<div class="note" style="color:var(--sub)">'+L('Your lists are kept on this device only for now.','Je lijsten worden voorlopig alleen op dit apparaat bewaard.')+'</div>')+'</section>';
}
var ICON={radar:'M12 21a9 9 0 1 1 9-9M12 16a4 4 0 1 1 4-4M12 12l7-7',pipe:'M5 6h14v14H5zM5 10h14M9 3v4M15 3v4',listed:'M4 20V10M10 20V4M16 20v-7M21 20H3',news:'M5 5h11v14H5zM16 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5',mine:'M12 4l2.5 5.2l5.5.8l-4 4l1 5.6L12 17l-5 2.6l1-5.6l-4-4l5.5-.8z'};
function render(){
  app.setAttribute('data-skin',S.skin);document.documentElement.lang=S.lang;
  var det=S.detail&&byId(S.detail),setOn=S.tab==='set'&&!det;
  var body=det?vDetail(det):({radar:vRadar,pipe:vPipe,listed:vListed,news:vNews,mine:vMine,set:vSet,cmp:vCmp}[S.tab]||vRadar)();
  var d=new Date().toLocaleDateString(loc(),{weekday:'short',day:'numeric',month:'short'}).toUpperCase().replace(/\./g,'');
  var nn=newNews(),upd=IPOS.some(function(i){return changes(i).length||hit(i.id);});
  var tabs=[['radar','RADAR'],['pipe',L('PIPELINE','PIJPLIJN')],['listed',L('LISTED','GENOTEERD')],['news',L('NEWS','NIEUWS')],['mine',L('MY LIST','MIJN LIJST')]];
  var key=(S.detail||S.tab)+S.pipeV+S.listV,sc=(app.querySelector('main')||{}).scrollTop||0,keep=render.last===key;
  app.innerHTML='<header><div class="col" style="gap:3px"><b style="font-size:18px;letter-spacing:.14em"><span style="color:var(--accent)">I</span><span style="color:var(--label)">PO RADAR</span></b><small class="cap" style="font-weight:500">'+d+(META&&META.updated?' · DATA '+fmtDate(META.updated):'')+'</small></div><button class="pill" data-act="tab" data-id="'+(setOn?'radar':'set')+'" aria-label="'+L('Customize','Aanpassen')+'" style="display:flex;align-items:center;gap:8px;font-size:12px;'+(setOn?'background:var(--accent-fill);color:var(--on-accent)':'background:var(--well)')+'"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4"></path></svg>'+L('CUSTOMIZE','AANPASSEN')+'</button></header><main>'+body+'</main><nav aria-label="'+L('Sections','Onderdelen')+'">'+tabs.map(function(t){var on=S.tab===t[0]&&!det,b=(t[0]==='news'&&nn)||(t[0]==='mine'&&upd);return '<button data-act="tab" data-id="'+t[0]+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICON[t[0]]+'"></path></svg>'+t[1]+(b?'<i aria-hidden="true"></i>':'')+'</button>';}).join('')+'</nav>';
  if(keep)app.querySelector('main').scrollTop=sc;
  render.last=key;
  if(refocus){refocus=false;var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length);}catch(e){}}}
}
function val(id){var e=document.getElementById(id);return e?parseFloat(String(e.value).replace(',','.')):NaN;}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id'),cur=S.detail,o,i;
  if(a==='tab'){if(S.tab==='news'&&NEWS.length){S.newsSeen=NEWS[0].date||S.newsSeen;save();}S.tab=id;S.detail=null;}
  else if(a==='open'){S.detail=id;}
  else if(a==='back'){S.detail=null;}
  else if(a==='cal'){S.tab='pipe';S.pipeV='cal';S.calM=0;S.detail=null;}
  else if(a==='pipev'){S.pipeV=id;}
  else if(a==='listv'){S.listV=id;}
  else if(a==='calm'){S.calM+=Number(id);}
  else if(a==='region'){S.region=id;}
  else if(a==='clearf'){S.q='';S.region='all';S.sector='';S.stageF='';}
  else if(a==='fav'){o=Object.assign({},S.fav);if(o[id])delete o[id];else o[id]=true;S.fav=o;save();}
  else if(a==='trk'){o=Object.assign({},S.trk);i=byId(id);if(o[id])delete o[id];else if(i)o[id]={since:today(),note:'',snap:snap(i)};S.trk=o;save();}
  else if(a==='seen'){o=Object.assign({},S.trk);i=byId(id);if(o[id]&&i){o[id]=Object.assign({},o[id],{snap:snap(i)});S.trk=o;save();}}
  else if(a==='cmp'){o=S.cmp.slice();var k=o.indexOf(id);if(k>=0)o.splice(k,1);else{o.push(id);if(o.length>3)o.shift();}S.cmp=o;save();}
  else if(a==='cmpclear'){S.cmp=[];save();}
  else if(a==='al'){var lv=val('lvl');if(!(lv>0)||!cur)return;o=Object.assign({},S.alerts);o[cur]={dir:id,level:lv};S.alerts=o;save();}
  else if(a==='alx'){o=Object.assign({},S.alerts);delete o[id];S.alerts=o;save();}
  else if(a==='buy'){var am=val('amt');if(!(am>0)||!cur)return;S.paper=S.paper.concat([{id:cur,basis:id,amt:Math.round(am*100)/100,on:today()}]).slice(-40);save();S.detail=null;S.tab='mine';}
  else if(a==='px'){o=S.paper.slice();o.splice(Number(id),1);S.paper=o;save();}
  else if(a==='nf'){S.newsF=id;}
  else if(a==='skin'){S.skin=id;save();}
  else if(a==='lang'){S.lang=id;save();}
  render();
});
app.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;refocus=true;render();}});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sector'){S.sector=t.value;render();}
  else if(t.id==='stageF'){S.stageF=t.value;render();}
  else if(t.id==='note'){var id=t.getAttribute('data-id');if(!S.trk[id])return;var o=Object.assign({},S.trk);o[id]=Object.assign({},o[id],{note:String(t.value).slice(0,2000)});S.trk=o;save();}
});
render();
var timer=setTimeout(function(){if(!ready){slow=true;render();}},10000);
function got(){ready=true;clearTimeout(timer);slow=false;render();}
function fail(){clearTimeout(timer);ready=true;render();}
var DK='ipo-radar-data';
function apply(d){if(!d||!Array.isArray(d.ipos))return false;IPOS=d.ipos;NEWS=(d.news||[]).slice().sort(function(a,b){return String(b.date||'')<String(a.date||'')?-1:1;});META=d.meta||null;return true;}
function load(){
  fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){if(apply(d)){try{localStorage.setItem(DK,JSON.stringify(d));}catch(e){}got();}else fail();}).catch(function(){if(!IPOS.length)fail();});
}
try{var c=JSON.parse(localStorage.getItem(DK)||'null');if(apply(c))got();}catch(e){}
load();
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
})();
</script>
</body>
</html>
